[project]
name = "trendkeeper"
version = "0.1.0"
description = "Daily trend-following advisor for a small ETF portfolio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=2.0", "yfinance>=0.2.50"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
